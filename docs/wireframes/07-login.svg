<svg width="680" height="340" viewBox="0 0 680 340" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
<rect width="680" height="340" fill="#ffffff"/>
<style>
  .box { fill:#f8fafc; stroke:#94a3b8; stroke-width:1; }
  .teal { fill:#e0f2f1; stroke:#4db6ac; stroke-width:1; }
  .purple { fill:#ede7f6; stroke:#9575cd; stroke-width:1; }
  .th { fill:#0f172a; font-size:13px; font-weight:bold; }
  .ts { fill:#64748b; font-size:11px; }
</style>
<rect class="box" x="40" y="40" width="600" height="40" rx="4"/><text class="th" x="60" y="65">Header</text>
<rect class="box" x="190" y="100" width="300" height="200" rx="4"/>
<text class="th" x="340" y="130" text-anchor="middle">Login</text>
<rect class="teal" x="210" y="150" width="260" height="30" rx="4"/><text class="ts" x="220" y="170">Email</text>
<rect class="teal" x="210" y="190" width="260" height="30" rx="4"/><text class="ts" x="220" y="210">Password (show/hide)</text>
<rect class="purple" x="210" y="232" width="260" height="30" rx="4"/><text class="th" x="340" y="252" text-anchor="middle">Sign in</text>
<text class="ts" x="340" y="284" text-anchor="middle">Forgot password? / Register</text>
</svg>
